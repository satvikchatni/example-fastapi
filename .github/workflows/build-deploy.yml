name: Build and Deploy Code
on: [push, pull_request]
jobs:
  job1:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
      DATABASE_HOSTNAME: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_NAME: fastapi_test
      DATABASE_PASSWORD: Rishabh%402007
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: Rishabh%402007
          POSTGRES_DB: fastapi_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: pulling git repo
        uses: actions/checkout@v4

      - name: install python version 
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: install all dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest httpx

      - name: test with pytest
        # 🗹 FIXED: Passing PGHOST overrides 'localhost' inside the database connection driver completely!
        env:
          PGHOST: 127.0.0.1
        run: python -m pytest tests/ -vv -s






