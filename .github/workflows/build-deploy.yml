name: Build and Deploy Code
on: [push, pull_request]
jobs:
  job1:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
      DATABASE_HOSTNAME: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      # 🗹 MATCHED: Changed from fastapitest to fastapi to satisfy your code's fallback name
      DATABASE_NAME: fastapi
      DATABASE_PASSWORD: adminpassword
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: adminpassword
          # 🗹 MATCHED: Changed the temporary container database name to fastapi
          POSTGRES_DB: fastapi
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '5432:5432'

    steps:
      - name: pulling git repo
        uses: actions/checkout@v4

      - name: Clear Committed Local Env Cache
        run: |
          rm -f .env
          rm -f app/.env
          rm -f tests/.env

      - name: install python version 
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: install all dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest httpx

      - name: test with pytest
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: adminpassword
          # 🗹 MATCHED: Set the override to match fastapi
          PGDATABASE: fastapi
        run: python -m pytest tests/ -vv -s









