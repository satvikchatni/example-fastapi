name: Build and Deploy Code
on: [push, pull_request]
jobs:
  job1:
    runs-on: ubuntu-latest
    environment:
      name: dev
    env:
      DATABASE_HOSTNAME: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_NAME: fastapi_test
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          POSTGRES_DB: fastapi_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: pulling git repo
        uses: actions/checkout@v4

      - name: install python version 
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: install all dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest httpx

      # 🔍 DIAGNOSTIC STEP: Bypasses pytest to look inside your config files directly
      - name: Debug Environment and Configurations
        run: |
          python -c "
          try:
              print('--- Checking Environment Variables ---')
              import os
              print('Hostname:', os.getenv('DATABASE_HOSTNAME'))
              print('Port:', os.getenv('DATABASE_PORT'))
              
              print('\n--- Attempting to Import App Configurations ---')
              from app.config import settings
              print('Successfully imported settings!')
              print('Configured Host:', settings.database_hostname)
          except Exception as e:
              import traceback
              print('\n💥 CRASH DETECTED DURING IMPORT:')
              traceback.print_exc()
          "

      - name: test with pytest
        run: python -m pytest




